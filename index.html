<!DOCTYPE html>
<html>
<head>
    <title>EzyScript - Access Key</title>
    <style>
        body { background: #0a0a0f; color: #e0e0e0; font-family: Arial; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: #0f0f14; border: 1px solid #00ffff; padding: 40px; max-width: 600px; width: 100%; }
        h1 { color: #00ffff; text-align: center; font-size: 36px; }
        .subtitle { text-align: center; color: #555; margin-bottom: 35px; }
        .password-box { background: #000; border: 1px solid #00ff00; padding: 30px; margin-bottom: 35px; text-align: center; }
        .password { font-size: 32px; color: #00ff00; background: #001100; padding: 20px; margin: 20px 0; border: 1px solid #00ff00; }
        .copy-btn { background: transparent; color: #00ffff; border: 1px solid #00ffff; padding: 15px 30px; cursor: pointer; font-size: 14px; width: 100%; }
        .copy-btn:hover { background: rgba(0, 255, 255, 0.1); }
        .platform-btn { display: block; background: #141419; border: 1px solid #333; padding: 22px 25px; margin: 10px 0; text-decoration: none; color: #888; text-align: center; }
        .platform-btn:hover { background: #1e1e28; border-color: #00ffff; color: #fff; }
        .timer { margin-top: 30px; padding: 18px; background: #001400; border: 1px solid #00ff00; text-align: center; color: #00ff00; }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚡ EZYSCRIPT</h1>
        <p class="subtitle">// ACCESS TERMINAL</p>
        
        <div class="password-box">
            <p style="color:#555; margin-bottom:15px;">Current Access Key:</p>
            <div class="password" id="password">CheckTest</div>
            <button class="copy-btn" onclick="copyPassword()">[ COPY PASSWORD ]</button>
        </div>
        
        <p style="text-align:center; color:#555; margin:25px 0;">// Support Channels</p>
        
        <a href="YOUR_LINKVERTISE_OR_LOOTLABS_LINK" class="platform-btn" target="_blank">
            <strong>🔗 Complete to Unlock</strong><br>
            <small>Support development & get instant access</small>
        </a>
        
        <div class="timer">
            NEXT KEY ROTATION: <span id="countdown">Loading...</span>
        </div>
        
        <p style="text-align:center; color:#555; font-size:12px; margin-top:20px;">
             Key expires every 12 hours
        </p>
    </div>
    
    <script>
        function copyPassword() {
            navigator.clipboard.writeText(document.getElementById('password').innerText);
            const btn = document.querySelector('.copy-btn');
            btn.innerText = '[ ✓ COPIED ]';
            btn.style.borderColor = '#00ff00';
            btn.style.color = '#00ff00';
            setTimeout(() => {
                btn.innerText = '[ COPY PASSWORD ]';
                btn.style.borderColor = '#00ffff';
                btn.style.color = '#00ffff';
            }, 2000);
        }
        
        function updateCountdown() {
            const now = new Date();
            const nextUpdate = new Date(now);
            if (now.getHours() < 12) {
                nextUpdate.setHours(12, 0, 0, 0);
            } else {
                nextUpdate.setHours(24, 0, 0, 0);
            }
            const diff = nextUpdate - now;
            const h = Math.floor(diff / (1000 * 60 * 60));
            const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((diff % (1000 * 60)) / 1000);
            document.getElementById('countdown').textContent = 
                `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
        }
        updateCountdown();
        setInterval(updateCountdown, 1000);
    </script>
</body>
</html>
